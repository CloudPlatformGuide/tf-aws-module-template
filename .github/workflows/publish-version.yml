name: Publish Terraform Module to S3

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (leave empty to use latest git tag)"
        required: false
        default: ""
      region:
        description: "AWS region (defaults to us-east-1 or the AWS_REGION repo variable)"
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      # Region: workflow input → repo variable → literal default.
      REGION: ${{ github.event.inputs.region || vars.AWS_REGION || 'us-east-1' }}
      # Role: repo variable → legacy default (backwards-compatible with existing setups).
      ROLE: ${{ vars.AWS_ROLE_NAME || 'AWS-TF-GITHUB-ROLE' }}
      # Module name: repo variable → repo name derived from GITHUB_REPOSITORY.
      MODULE_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.ROLE }}
          aws-region: ${{ env.REGION }}

      - name: Determine version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            echo "VERSION=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve module name
        id: get_name
        run: |
          # Use PROJECT_NAME repo variable if set; otherwise derive from repo name.
          if [[ -n "${{ env.MODULE_NAME }}" ]]; then
            echo "NAME=${{ env.MODULE_NAME }}" >> "$GITHUB_OUTPUT"
          else
            echo "NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package module
        run: |
          NAME="${{ steps.get_name.outputs.NAME }}"
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          mkdir -p dist

          zip -r "dist/${NAME}-${VERSION}.zip" . \
            -x "*.git*" \
            -x "dist/*" \
            -x ".github/*" \
            -x ".DS_Store" \
            -x "outputs/*" \
            -x "plans/*"

          echo "Created: dist/${NAME}-${VERSION}.zip"

      - name: Upload to S3
        run: |
          NAME="${{ steps.get_name.outputs.NAME }}"
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          DEST="s3://${{ secrets.S3_BUCKET_NAME }}/modules/${NAME}-${VERSION}.zip"

          aws s3 cp "dist/${NAME}-${VERSION}.zip" "$DEST" --region "${{ env.REGION }}"

          echo "Published: ${DEST}"

      - name: Install terraform-docs
        run: |
          curl -sL "https://github.com/terraform-docs/terraform-docs/releases/latest/download/terraform-docs-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin terraform-docs

      - name: Generate terraform-docs JSON
        run: |
          terraform-docs json . > "${{ steps.get_name.outputs.NAME }}.json"

      - name: Publish docs to iac-catalog
        env:
          IAC_CATALOG_TOKEN: ${{ secrets.IAC_CATALOG_TOKEN }}
          IAC_CATALOG_REPO: ${{ vars.IAC_CATALOG_REPO }}
          NAME: ${{ steps.get_name.outputs.NAME }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${IAC_CATALOG_TOKEN}@github.com/${IAC_CATALOG_REPO}.git" \
            catalog-repo

          # Copy the terraform-docs JSON into the catalog
          cp "${NAME}.json" "catalog-repo/site/data/modules/${NAME}.json"

          # Upsert version + updated in catalog.config.json, preserving any existing category
          cd catalog-repo/site
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('catalog.config.json', 'utf8'));
            if (!cfg.modules) cfg.modules = {};
            if (!cfg.modules[process.env.NAME]) cfg.modules[process.env.NAME] = { category: 'uncategorized' };
            cfg.modules[process.env.NAME].version = process.env.VERSION.replace(/^v/, '');
            cfg.modules[process.env.NAME].updated = new Date().toISOString().slice(0, 10);
            fs.writeFileSync('catalog.config.json', JSON.stringify(cfg, null, 2) + '\n');
          "

          # Regenerate the catalog index
          node scripts/build-catalog.mjs

          # Commit and push if anything changed
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "site/data/modules/${NAME}.json" "site/catalog.config.json" "site/data/modules.json"
          git diff --staged --quiet || \
            git commit -m "docs(${NAME}): publish terraform-docs ${VERSION}"
          git push
